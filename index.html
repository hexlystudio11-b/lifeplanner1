<script>
const K='lifeplanner.demo.v1',$=s=>document.querySelector(s);
const D={tasks:[],rec:[],goals:[],habits:[],blocks:{},tx:[],bud:{},debts:[],extra:0,sav:[],meals:{},groc:[],work:[],wt:[],wu:'kg',water:{},wg:8,cur:'$'};
let S,ok=true;
try{S=Object.assign({},D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=JSON.parse(JSON.stringify(D));ok=false}
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)}

const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date()),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ORD=[1,2,3,4,5,6,0];
const money=n=>(n<0?'-':'')+S.cur+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});
const sum=a=>a.reduce((s,x)=>s+x.amt,0),tm=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const fmt=(s,o)=>P(s).toLocaleDateString(undefined,o||{weekday:'long',month:'long',day:'numeric'});
const wkStart=s=>add(s,-((P(s).getDay()+6)%7));
const empty=t=>`<p class=m>${t}</p>`;
const bar=(p,c)=>`<div class=bar><i style="width:${Math.min(100,Math.max(0,p||0))}%;background:${c||'var(--a)'}"></i></div>`;
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const V={tab:'dash',date:today(),cal:'month',bm:today().slice(0,7),sub:{tasks:'one',bud:'bud'}};
const CATS=['Salary','Housing','Food','Transport','Bills','Health','Fun','Shopping','Savings','Other'];
const dl=`<datalist id=cats>${CATS.map(c=>`<option value="${c}">`).join('')}</datalist>`;
const chips=(pg,o)=>`<div class=chips>${o.map(([k,l])=>`<button class="${V.sub[pg]==k?'on':''}" onclick="A.sub('${pg}','${k}')">${l}</button>`).join('')}</div>`;

function dayItems(d){const wd=P(d).getDay();

${S.habits.map(h=>`<div class=hab><span class=n>${esc(h.t)}</span>${days.map(d=>`<button class="d ${h.log[d]?'on':''}" onclick="A.hab('${h.id}','${d}')" aria-label="${d}"></button>`).join('')}<small>${streak(h)}</small><button class=x onclick="A.del('habits','${h.id}')">×</button></div>`).join('')}</section>`};

function budPg(){const mt=S.tx.filter(x=>x.d.startsWith(V.bm)).sort((a,b)=>b.d.localeCompare(a.d)),inc=sum(mt.filter(x=>x.type=='in')),out=sum(mt.filter(x=>x.type=='out'));
 return`<div class=nav2><button class=gh onclick="A.bm(-1)">‹</button><b>${fmt(V.bm+'-01',{month:'long',year:'numeric'})}</b><button class=gh onclick="A.bm(1)">›</button></div>
<div class=grid style="margin-top:0"><div class=card><small>Income</small><div class=stat style="color:var(--g)">${money(inc)}</div></div><div class=card><small>Spent</small><div class=stat style="color:var(--r)">${money(out)}</div></div><div class=card><small>Left</small><div class=stat>${money(inc-out)}</div></div></div>
<section class=card style="margin-top:14px"><h2>Add transaction</h2>${dl}<form onsubmit="A.addTx(event)"><select name=type><option value=out>Expense</option><option value=in>Income</option></select><input type=date name=d value="${V.bm==today().slice(0,7)?today():V.bm+'-01'}" required><input name=t placeholder=Description required maxlength=60><input name=cat list=cats placeholder=Category style="width:120px"><input type=number name=amt step=0.01 min=0 placeholder=Amount required style="width:100px"><button class=btn>Add</button></form></section>
<section class=card><h2>Category budgets</h2><form onsubmit="A.setBud(event)"><input name=cat list=cats placeholder="Category" required style="width:140px"><input type=number name=lim min=0 step=0.01 placeholder="Monthly limit" required><button class=btn>Set budget</button></form>
${Object.entries(S.bud).map(([c,l])=>{const sp=sum(mt.filter(x=>x.type=='out'&&x.cat.toLowerCase()==c.toLowerCase()));return`<div>${esc(c)} <small>${money(sp)} of ${money(l)}</small><button class=x data-k="${esc(c)}" onclick="A.delBud(this.dataset.k)">×</button>${bar(sp/l*100,sp>l?'var(--r)':'var(--g)')}</div>`}).join('')||empty('Set a limit to see how much of it you have used.')}</section>
<section class=card><h2>Transactions</h2>${mt.map(x=>`<div class=row style="cursor:default"><small>${x.d.slice(8)}</small><span>${esc(x.t)} <small>${esc(x.cat)}</small></span><b style="margin-left:auto;color:${x.type=='in'?'var(--g)':'var(--t)'}">${x.type=='in'?'+':'−'}${money(x.amt)}</b><button class=x onclick="A.del('tx','${x.id}')">×</button></div>`).join('')||empty('No transactions this month.')}</section>`}
function debtPg(){const a=sim(S.extra),b=sim(0),dt=m=>fmt(iso(new Date(new Date().getFullYear(),new Date().getMonth()+m,1)),{month:'long',year:'numeric'});
 return`<section class=card><form onsubmit="A.addDebt(event)"><input name=n placeholder="Debt name" required maxlength=50><input type=number name=bal min=0 step=0.01 placeholder=Balance required style="width:100px"><input type=number name=apr min=0 step=0.01 placeholder="APR %" style="width:90px"><input type=number name=min min=0 step=0.01 placeholder="Min / month" required style="width:110px"><button class=btn>Add debt</button></form>
${S.debts.map(d=>`<div class=row style="cursor:default"><span>${esc(d.n)}</span><small>${d.apr}% · min ${money(d.min)}</small><b style="margin-left:auto">${money(d.bal)}</b><button class=x onclick="A.del('debts','${d.id}')">×</button></div>`).join('')||empty('Add your debts to see a payoff plan.')}</section>
${S.debts.length?`<section class=card><h2>Payoff plan <small>highest interest paid first</small></h2><label>Extra payment per month <input type=number min=0 step=1 value="${S.extra}" onchange="A.extra(this.value)" style="width:110px"></label>
${a?`<p>Debt free by <b>${dt(a.m)}</b> (${a.m} months), paying ${money(a.ti)} in interest.</p>${b&&S.extra>0?`<p class=m>Minimums only: ${b.m} months and ${money(b.ti)} interest. Your extra saves ${money(b.ti-a.ti)}.</p>`:''}`:'<p style="color:var(--r)">Minimum payments do not cover the interest. Increase a payment to see a payoff date.</p>'}</section>`:''}`}
function savPg(){return`<section class=card><form onsubmit="A.addSav(event)"><input name=n placeholder="Savings goal, e.g. Emergency fund" required maxlength=60><input type=number name=target min=1 step=0.01 placeholder=Target required style="width:110px"><button class=btn>Add</button></form></section>
${S.sav.map(g=>`<section class=card><h2>${esc(g.n)}<button class=x onclick="A.del('sav','${g.id}')">×</button></h2>${bar(g.cur/g.target*100,'var(--g)')}<small>${money(g.cur)} of ${money(g.target)} · ${Math.round(g.cur/g.target*100)}%</small><form onsubmit="A.dep(event,'${g.id}')" style="margin:8px 0 0"><input type=number name=a step=0.01 placeholder="Amount (negative to withdraw)" required><button class=btn>Update</button></form></section>`).join('')||empty('Create a savings goal to track it.')}`}
PG.bud=()=>`<h1>Money</h1>${chips('bud',[['bud','Budget'],['debt','Debt'],['sav','Savings']])}${{bud:budPg,debt:debtPg,sav:savPg}[V.sub.bud]()}`;

<div class=ml>${Array.from({length:7},(_,i)=>{const d=add(s,i),m=S.meals[d]||{};return`<section class=card style="margin:0"><h2 style="color:${d==today()?'var(--a)':'inherit'}">${fmt(d,{weekday:'long',day:'numeric'})}</h2>${SL.map(([k,n])=>`<small>${n}</small><input value="${esc(m[k]||'')}" onchange="A.meal('${d}','${k}',this.value)" maxlength=80>`).join('')}</section>`}).join('')}</div>

PG.fit=()=>{const t=today(),w=S.water[t]||0,L=S.wt,u=S.wu,cv=k=>(u=='kg'?k:k*2.20462).toFixed(1);
 return`<h1>Fitness</h1><div class=grid>
<section class=card><h2>Hydration <small>goal <input type=number min=1 value="${S.wg}" style="width:60px;padding:2px 6px" onchange="A.wgoal(this.value)"> glasses</small></h2><div class=wr>${Array.from({length:Math.max(S.wg,w)},(_,i)=>`<span class="drop ${i<w?'on':''}"></span>`).join('')}</div><p><b>${w}</b> of ${S.wg} today</p><button class=gh onclick="A.wat(-1)">−</button> <button class=btn onclick="A.wat(1)">Add a glass</button>
<p class=m>Last 7 days: ${Array.from({length:7},(_,i)=>S.water[add(t,i-6)]||0).join(' · ')}</p></section>
<section class=card><h2>Weight <span><button class="gh" onclick="A.unit('kg')" style="${u=='kg'?'border-color:var(--a)':''}">kg</button> <button class=gh onclick="A.unit('lb')" style="${u=='lb'?'border-color:var(--a)':''}">lb</button></span></h2><form onsubmit="A.addWt(event)"><input type=date name=d value="${t}" required><input type=number name=v step=0.1 min=1 placeholder="${u}" required style="width:90px"><button class=btn>Log</button></form>${spark(L.slice(-30).map(x=>x.kg))}
${L.length?`<p><b class=stat>${cv(L[L.length-1].kg)} ${u}</b> ${L.length>1?`<small>${(L[L.length-1].kg-L[0].kg>0?'+':'')+cv(L[L.length-1].kg-L[0].kg+(u=='kg'?0:0)).replace(/^-?/,m=>m)} ${u} since ${L[0].d}</small>`:''}</p>`:empty('Log your first weigh-in.')}
${L.slice(-5).reverse().map(x=>`<div class=row style="cursor:default"><small>${x.d}</small>${cv(x.kg)} ${u}<button class=x onclick="A.delWt('${x.d}')">×</button></div>`).join('')}</section></div>
<section class=card style="margin-top:14px"><h2>Workouts</h2><form onsubmit="A.addWork(event)"><input type=date name=d value="${t}" required><input name=t placeholder="Workout, e.g. Run" required maxlength=50><input type=number name=min min=1 placeholder=Minutes style="width:90px"><input name=note placeholder=Notes maxlength=100><button class=btn>Log workout</button></form>${S.work.slice(0,15).map(x=>`<div class=row style="cursor:default"><small>${fmt(x.d,{month:'short',day:'numeric'})}</small><span>${esc(x.t)} <small>${x.min} min ${esc(x.note)}</small></span><button class=x onclick="A.del('work','${x.id}')">×</button></div>`).join('')||empty('No workouts logged.')}</section>`};
PG.set=()=>`<h1>Settings</h1><section class=card><h2>Profile</h2><input value="${esc(S.name)}" placeholder="Your name" maxlength=30 onchange="A.name(this.value)"></section><section class=card><h2>Currency</h2><select onchange="A.cur(this.value)">${['$','€','£','¥','₹','Rs ','₦'].map(c=>`<option ${c==S.cur?'selected':''}>${c}</option>`).join('')}</select></section>
<section class=card><h2>Sample data</h2><p class=m>This is a preview with sample data. Your changes are saved in this browser only. Resetting, deleting and importing data are turned off in the preview.</p></section>`;

function modal(title,fields,fn,lock){const d=document.createElement('dialog');d.className='mdl';
 d.innerHTML=`<form><h2>${title}</h2>${fields.map(([n,l,t,v,o,opt])=>`<label>${l}${t=='select'?`<select name=${n}>${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:`<input name=${n} type=${t||'text'} value="${esc(v??'')}" ${t=='number'?'step=any min=0':''} ${opt?'':'required'}>`}</label>`).join('')}<div class=mb>${lock?'':'<button type=button class=gh>Cancel</button>'}<button class=btn>Save</button></div></form>`;
 const x=()=>{d.close();d.remove()};d.querySelector('form').onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target)));x()};
 if(!lock)d.querySelector('.gh').onclick=x;else d.oncancel=e=>e.preventDefault();document.body.appendChild(d);d.showModal()}

 habits:[['Drink 8 glasses of water',8],['Read 20 minutes',7],['Meditate',6],['Walk 8,000 steps',8],['No added sugar',5]].map(([x,p],k)=>({id:id(),t:x,log:hp(k,p)})),
 blocks:{[t]:[['07:00','08:00','Morning routine'],['09:00','11:30','Deep work: proposal'],['12:00','13:00','Lunch & walk'],['14:00','15:30','Meetings'],['18:00','19:00','Gym workout'],['20:00','21:00','Read & unwind']].map(([s1,e,x])=>({id:id(),s:s1,e,t:x}))},
 tx:[tx(md(1),'Salary',3200,'Salary','in'),tx(md(5),'Freelance project',450,'Salary','in'),tx(md(1),'Rent',950,'Housing'),tx(md(2),'Groceries',84.5,'Food'),tx(md(3),'Metro card',45,'Transport'),tx(md(4),'Internet & phone',68,'Bills'),tx(md(6),'Electricity',72,'Bills'),tx(md(7),'Dinner with friends',46,'Fun'),tx(md(8),'Groceries',63.2,'Food'),tx(md(9),'Pharmacy',22,'Health'),tx(md(10),'New running shoes',89,'Shopping'),tx(md(12),'Cinema',24,'Fun'),tx(md(13),'Groceries',71.8,'Food'),tx(md(14),'Fuel',38,'Transport'),tx(md(16),'Coffee & lunch',31,'Food'),tx(pm(1),'Salary',3200,'Salary','in'),tx(pm(1),'Rent',950,'Housing'),tx(pm(8),'Groceries',210,'Food'),tx(pm(15),'Weekend trip',160,'Fun'),tx(pm(20),'Utilities',140,'Bills')],
